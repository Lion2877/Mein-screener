yamlname: Aktien-Screener-Timer

on:
  schedule:
    # Startet alle 5 Minuten von Montag bis Freitag
    - cron: '*/5 * * * 1-5'
  workflow_dispatch: # Erlaubt uns, den Start-Knopf auch manuell zu drücken

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Module installieren
        run: pip install yfinance pytz requests

      - name: Screener ausfuehren
        run: python screener.py
