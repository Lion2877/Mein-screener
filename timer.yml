name: Aktien-Screener-Timer
on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:
jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pytz requests
      - run: python screener.py
